<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golf Tour Scorer</title>
<meta name="theme-color" content="#1f2b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golf Tour">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling view, fixed bottom tab bar; scorecards run holes down, players across with the match chevron between the two sides. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #18202e; --muted: #5f6b7a; --rule: #dde3ea; --rule-strong: #c4ccd6;
  --navy: #1f2b45; --navy-ink: #ffffff;
  --t1: #c8372d; --t2: #2a5fb0; --t1-ink: #ffffff; --t2-ink: #ffffff;
  --as: #f2c94c; --as-ink: #3d3000; --as-soft: #fbedb8;
  --birdie: #2f80d1; --bogey: #e2b100; --dbl: #d9534f; --pickup: #8a94a3; --ok: #1f7a4a;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --toph: 56px;
  --t1-soft: color-mix(in srgb, var(--t1) 22%, var(--surface)); --t2-soft: color-mix(in srgb, var(--t2) 22%, var(--surface));
  --t1-text: color-mix(in srgb, var(--t1) 85%, var(--ink)); --t2-text: color-mix(in srgb, var(--t2) 85%, var(--ink));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151d; --surface: #182030; --ink: #e8edf4; --muted: #9aa6b6; --rule: #273246; --rule-strong: #34425a;
  --navy: #0b1222; --navy-ink: #e8edf4; --as: #e3b93a; --as-ink: #2b2200; --as-soft: #4a4020;
  --birdie: #5fa7ef; --bogey: #f1cb3b; --dbl: #f07b78; --pickup: #8592a5; --ok: #6cc493; color-scheme: dark;
  --t1-soft: color-mix(in srgb, var(--t1) 35%, var(--surface)); --t2-soft: color-mix(in srgb, var(--t2) 35%, var(--surface));
  --t1-text: color-mix(in srgb, var(--t1) 60%, #ffffff); --t2-text: color-mix(in srgb, var(--t2) 60%, #ffffff); } }
:root[data-theme="dark"] {
  --bg: #10151d; --surface: #182030; --ink: #e8edf4; --muted: #9aa6b6; --rule: #273246; --rule-strong: #34425a;
  --navy: #0b1222; --navy-ink: #e8edf4; --as: #e3b93a; --as-ink: #2b2200; --as-soft: #4a4020;
  --birdie: #5fa7ef; --bogey: #f1cb3b; --dbl: #f07b78; --pickup: #8592a5; --ok: #6cc493; color-scheme: dark;
  --t1-soft: color-mix(in srgb, var(--t1) 35%, var(--surface)); --t2-soft: color-mix(in srgb, var(--t2) 35%, var(--surface));
  --t1-text: color-mix(in srgb, var(--t1) 60%, #ffffff); --t2-text: color-mix(in srgb, var(--t2) 60%, #ffffff); }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--birdie); outline-offset: 2px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); color: var(--navy-ink);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .row { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font: 700 21px/1.1 var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.top .who { font-size: 12px; opacity: .85; text-align: right; }
main { max-width: 760px; margin: 0 auto; padding-block: 14px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: clip; }
.card > h2 { margin: 0; font: 700 17px/1.2 var(--f-display); letter-spacing: .02em; padding: 12px 14px; }
.pad { padding: 12px 14px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.eyebrow { font: 600 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; margin-right: 5px; background: var(--muted); flex: 0 0 auto; }
.dot.t1 { background: var(--t1); } .dot.t2 { background: var(--t2); }
.btn { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 7px; padding: 9px 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.btn.primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.banner { background: color-mix(in srgb, var(--as) 30%, var(--surface)); border: 1px solid color-mix(in srgb, var(--as) 60%, var(--surface)); border-radius: 8px; padding: 10px 12px; font-size: 13px; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { background: none; border: 0; padding: 10px 4px 12px; font: 600 13px/1.1 var(--f-body); color: var(--muted); display: grid; gap: 4px; justify-items: center; cursor: pointer; }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tabs button[aria-current="page"] { color: var(--ink); } .tabs button[aria-current="page"] svg { stroke: var(--birdie); }

/* Controls */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips button { flex: 0 0 auto; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 999px; padding: 7px 12px; font: 600 13px/1 var(--f-body); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--rule-strong); border-radius: 7px; overflow: hidden; max-width: 100%; }
.seg button { background: var(--surface); border: 0; border-left: 1px solid var(--rule-strong); padding: 8px 11px; font: 600 12.5px/1.1 var(--f-body); cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--navy); }
.ghead { display: grid; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--rule); }
.ghead .t { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ghead h2 { margin: 0; font: 700 18px/1.15 var(--f-display); }
.coursebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.coursebar b { font: 700 17px/1.2 var(--f-display); }
.tee { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-weight: 600; font-size: 12.5px; background: var(--bg); }
.tee i { width: 11px; height: 11px; border-radius: 50%; background: var(--tee, #2a5fb0); border: 1px solid rgb(0 0 0 / .15); }

/* Chevrons (Ryder Cup style): point to the leading side; light = leading, deep = won, yellow = all square */
.chev { display: inline-grid; place-items: center; height: 24px; min-width: 50px; font: 700 12px/1 var(--f-display); letter-spacing: .03em; white-space: nowrap; }
.chev.l { padding: 0 7px 0 13px; clip-path: polygon(11px 0, 100% 0, 100% 100%, 11px 100%, 0 50%); }
.chev.r { padding: 0 13px 0 7px; clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 0 100%); }
.chev.t1 { background: var(--t1-soft); color: var(--t1-text); } .chev.t2 { background: var(--t2-soft); color: var(--t2-text); }
.chev.t1.deep { background: var(--t1); color: var(--t1-ink); } .chev.t2.deep { background: var(--t2); color: var(--t2-ink); }
.chev.as { background: var(--as-soft); color: var(--as-ink); border-radius: 4px; padding: 0 8px; min-width: 40px; }
.chev.as.deep { background: var(--as); }
.chev.ns { background: var(--bg); color: var(--muted); border-radius: 4px; padding: 0 8px; font-weight: 600; }
.chev.big { height: 30px; min-width: 76px; font-size: 14.5px; }
.chev.big.l { padding-left: 16px; } .chev.big.r { padding-right: 16px; }
.dm { display: block; font: 600 10px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 2px; }

/* Order of play */
.order { list-style: none; margin: 0; padding: 0; }
.order > li { border-top: 1px solid var(--rule); }
.order .gbtn { width: 100%; text-align: left; background: none; border: 0; padding: 11px 14px; display: grid; grid-template-columns: 50px 1fr; gap: 10px; cursor: pointer; }
.order .teet { font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.order .teet small { display: block; font: 500 11px/1.4 var(--f-body); color: var(--muted); }
.order .lbl { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 12.5px; color: var(--muted); }
.mline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 5px 0; }
.mline .a { min-width: 0; font-size: 14px; } .mline .b { min-width: 0; font-size: 14px; text-align: right; }
.mline .c { text-align: center; }
.mline .c .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }

/* Scorecard */
table.sc { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; table-layout: fixed; }
.sc th, .sc td { text-align: center; padding: 0; border-bottom: 1px solid var(--rule); }
.sc thead th { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph)); z-index: 2; background: var(--navy); color: var(--navy-ink); font: 600 13px/1.15 var(--f-display); padding: 8px 2px 6px; vertical-align: bottom; }
.sc thead th .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc thead th .hc { display: block; font: 500 10.5px/1.3 var(--f-body); opacity: .8; }
.sc thead th .bar { display: block; height: 3px; border-radius: 2px; margin: 4px 8px 0; background: transparent; }
.sc thead th .bar.t1 { background: var(--t1); } .sc thead th .bar.t2 { background: var(--t2); }
.sc col.hole { width: 46px; } .sc col.mid { width: 64px; }
.sc tbody tr.hrow { cursor: pointer; }
.sc tbody tr.hrow.ro { cursor: default; }
.sc td.h { text-align: left; padding: 4px 0 4px 8px; }
.sc td.h b { font: 700 16px/1 var(--f-display); }
.sc td.h span { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.25; }
.sc td.c { height: 46px; }
.sc td.c.win-t1 { background: var(--t1-soft); } .sc td.c.win-t2 { background: var(--t2-soft); }
.sc td.mid { background: color-mix(in srgb, var(--navy) 4%, var(--surface)); }
.sc tr.tot td { background: color-mix(in srgb, var(--navy) 8%, var(--surface)); font: 700 15px/1 var(--f-display); height: 34px; }
.sc tr.tot td.h { font: 700 12px/1 var(--f-body); letter-spacing: .05em; }
.cv { position: relative; display: inline-grid; place-items: center; min-width: 28px; }
.cv .shots { position: absolute; top: -3px; right: -8px; display: flex; flex-direction: column; gap: 2px; }
.cv .shots i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
.pts { font: 600 17px/1 var(--f-display); } .pts.zero { color: var(--muted); }
.empty-cell { color: var(--rule-strong); font: 600 15px/1 var(--f-display); }
.mk { display: inline-grid; place-items: center; width: 28px; height: 28px; font: 600 17px/1 var(--f-display); }
.mk.eagle { border: 2px solid var(--birdie); border-radius: 50%; box-shadow: inset 0 0 0 2px var(--surface), inset 0 0 0 4px var(--birdie); }
.mk.birdie { border: 2px solid var(--birdie); border-radius: 50%; }
.mk.bogey { border: 2px solid var(--bogey); }
.mk.dbl { border: 2px solid var(--dbl); box-shadow: inset 0 0 0 2px var(--surface), inset 0 0 0 4px var(--dbl); }
.mk.pu { color: var(--pickup); font-size: 15px; }
td.win-t1 .mk.eagle, td.win-t1 .mk.dbl { box-shadow: inset 0 0 0 2px var(--t1-soft), inset 0 0 0 4px currentColor; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; padding: 10px 14px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .mk { width: 24px; height: 24px; font-size: 13px; }
.legend .sw { width: 18px; height: 18px; border-radius: 3px; }

/* Tables */
table.lb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.lb th { text-align: left; font: 600 11px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 9px 8px; border-bottom: 1px solid var(--rule); }
.lb td { padding: 9px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.lb td.pos { font: 700 16px/1.2 var(--f-display); width: 44px; }
.lb td.num, .lb th.num { text-align: right; }
.lb td.num { font: 700 17px/1.2 var(--f-display); width: 58px; }
.lb td.thru { text-align: center; font: 600 15px/1.2 var(--f-display); width: 54px; color: var(--muted); }
.lb th.thru { text-align: center; }
.lb td.thru.f { color: var(--ink); }
.lb .note { display: block; font-size: 11.5px; color: var(--muted); }
.lb .sub { display: block; font: 500 11px/1.2 var(--f-body); color: var(--muted); }
.lb tr.dim td { color: var(--muted); }
.lb tr.tap { cursor: pointer; }
.lb td.pm { width: 26px; text-align: center; color: var(--muted); font: 700 16px/1.2 var(--f-display); }
.lb tr.detail td { padding: 0 0 10px; background: color-mix(in srgb, var(--navy) 3%, var(--surface)); }

/* Compact horizontal cards */
.mini { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; margin-top: 6px; }
.mini th, .mini td { text-align: center; padding: 0; height: 27px; font: 500 13px/1 var(--f-display); border-bottom: 1px solid var(--rule); }
.mini th:first-child, .mini td:first-child { text-align: left; padding-left: 8px; width: 60px; font: 700 10.5px/1.1 var(--f-body); letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini tr.hd th { background: var(--navy); color: var(--navy-ink); font: 700 13px/1 var(--f-display); }
.mini .tot { font-weight: 700; width: 32px; }
.mini .mk { width: 21px; height: 21px; font-size: 13px; }
.mini .mk.eagle { box-shadow: inset 0 0 0 1.5px var(--surface), inset 0 0 0 3px var(--birdie); }
.mini .mk.dbl { box-shadow: inset 0 0 0 1.5px var(--surface), inset 0 0 0 3px var(--dbl); }
.mini td.win-t1 { background: var(--t1-soft); } .mini td.win-t2 { background: var(--t2-soft); }
.mini .ms { display: inline-grid; place-items: center; min-width: 22px; height: 18px; border-radius: 3px; font: 700 11px/1 var(--f-display); padding: 0 3px; }
.mini .ms.t1 { background: var(--t1-soft); color: var(--t1-text); } .mini .ms.t2 { background: var(--t2-soft); color: var(--t2-text); }
.mini .ms.t1.deep { background: var(--t1); color: var(--t1-ink); } .mini .ms.t2.deep { background: var(--t2); color: var(--t2-ink); }
.mini .ms.as { background: var(--as-soft); color: var(--as-ink); }
.mini .ms.as.deep { background: var(--as); }

/* Cup */
.cup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; padding: 16px 14px 8px; gap: 8px; }
.cup .side { text-align: center; }
.cup .side .tn { display: block; font: 700 22px/1.1 var(--f-display); letter-spacing: .02em; margin-bottom: 4px; }
.cup .side b { display: block; font: 700 48px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.cup .vs { font: 600 13px/1 var(--f-body); color: var(--muted); padding-bottom: 14px; }
.towin { text-align: center; padding: 0 14px 14px; color: var(--muted); font-size: 13px; }
details.sess { border-top: 1px solid var(--rule); }
details.sess > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-weight: 600; }
details.sess > summary::-webkit-details-marker { display: none; }
details.sess > summary .pm, .xrow .pm { font: 700 18px/1 var(--f-display); color: var(--muted); }
details.sess[open] > summary .pm::before { content: "−"; } details.sess:not([open]) > summary .pm::before { content: "+"; }
.xrow { border-top: 1px solid var(--rule); }
.xrow > button { width: 100%; background: none; border: 0; text-align: left; padding: 10px 14px 10px 10px; display: grid; grid-template-columns: 18px 1fr; gap: 6px; align-items: center; cursor: pointer; }
.xrow .det { padding: 0 10px 12px; }
.xrow .mline .a b, .xrow .mline .b b { display: block; font: 700 15px/1.2 var(--f-display); }

/* Submit */
.submit { display: grid; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--rule); }
.submit .ok { color: var(--ok); font-weight: 600; }

/* Admin */
.form { display: grid; gap: 12px; padding: 0 14px 14px; }
.frow { display: grid; gap: 6px; }
.frow label, .frow .lab { font-weight: 600; font-size: 13px; }
.frow input[type=text], .frow input[type=time], .frow select { border: 1px solid var(--rule-strong); border-radius: 7px; padding: 9px 10px; background: var(--surface); width: 100%; }
.teamrow { display: grid; grid-template-columns: 1fr; gap: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--rule-strong); cursor: pointer; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

/* Entry sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px rgb(0 0 0 / .18);
  padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-height: 88vh; overflow-y: auto; }
.sheet .in { max-width: 520px; margin: 0 auto; display: grid; gap: 10px; }
.sheet .hd h3 { margin: 0; font: 700 22px/1 var(--f-display); }
.erow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); }
.erow .nm { font-weight: 600; min-width: 0; }
.erow .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.stepper { display: grid; grid-template-columns: 46px 52px 46px 46px; gap: 6px; align-items: center; }
.stepper button { height: 46px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--bg); font: 700 22px/1 var(--f-display); cursor: pointer; }
.stepper button.p { font-size: 16px; }
.stepper button.p[aria-pressed="true"] { background: var(--pickup); color: #fff; border-color: var(--pickup); }
.stepper .val { display: grid; place-items: center; }
.sheet .acts { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; margin-top: 4px; }
.sheet .acts .btn { padding: 13px 8px; font-size: 15px; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--navy); color: var(--navy-ink); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgb(0 0 0 / .2); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }

/* Setup */
.btn.sm { padding: 6px 10px; font-size: 12.5px; }
.lb.ed td { padding: 6px 6px; vertical-align: middle; }
